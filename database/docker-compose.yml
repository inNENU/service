# inNENU Service 本地开发数据库（MariaDB 11.8）
#
# 首次启动时会自动完成初始化：
#   1. 创建 `innenu-service` 数据库、`innenu-service` 用户（见下方 MARIADB_* 环境变量）
#   2. 执行挂载到 /docker-entrypoint-initdb.d/ 的 `innenu-service.sql` 导入全部表结构与数据
#
# 启动：docker compose -f database/docker-compose.yml up -d
# 停止：docker compose -f database/docker-compose.yml down
# 重置（清空数据重新初始化）：docker compose -f database/docker-compose.yml down -v

services:
  mariadb:
    image: mariadb:11.8
    container_name: innenu-mariadb
    restart: unless-stopped
    environment:
      # root 密码（仅本地开发使用）
      MARIADB_ROOT_PASSWORD: innenu-service-root
      # 自动创建的数据库与业务账号，需与项目根目录 .env 中 MYSQL_* 保持一致
      MARIADB_DATABASE: innenu-service
      MARIADB_USER: innenu-service
      MARIADB_PASSWORD: innenu-service
    ports:
      # 仅绑定本机回环地址
      - "127.0.0.1:3306:3306"
    volumes:
      - innenu-mariadb-data:/var/lib/mysql
      # 初始化脚本：仅首次启动（数据卷为空）时执行
      - ./innenu-service.sql:/docker-entrypoint-initdb.d/00-innenu-service.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  innenu-mariadb-data:
